<!DOCTYPE html>
<html>
<head>

    <title>Cryptocurrency Price Tracker</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 30px;
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        #updated {
            color: #555;
            margin-bottom: 30px;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .card {
            background: white;
            width: 250px;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px #ccc;
        }

        .card h2 {
            font-size: 20px;
        }

        .price {
            font-size: 24px;
            font-weight: bold;
            margin: 15px 0;
        }

        .change {
            font-size: 18px;
            font-weight: bold;
        }

        .up {
            color: green;
        }

        .down {
            color: red;
        }

        #error {
            color: red;
            font-weight: bold;
        }

    </style>

</head>

<body>

    <h1>Cryptocurrency Price Tracker</h1>

    <p id="updated">Loading...</p>

    <p id="error"></p>

    <div
        id="cryptoContainer"
        class="container">
    </div>


    <script>

        const apiUrl =
            "https://api.coingecko.com/api/v3/coins/markets" +
            "?vs_currency=usd" +
            "&order=market_cap_desc" +
            "&per_page=10" +
            "&page=1" +
            "&sparkline=false";


        async function getCryptoData() {

            try {

                const response =
                    await fetch(apiUrl);

                if (!response.ok) {
                    throw new Error(
                        "API request failed"
                    );
                }

                const data =
                    await response.json();


                const container =
                    document.getElementById(
                        "cryptoContainer"
                    );

                const error =
                    document.getElementById(
                        "error"
                    );

                container.innerHTML = "";
                error.innerText = "";


                data.forEach(function(coin) {

                    const change =
                        coin.price_change_percentage_24h || 0;


                    const changeClass =
                        change >= 0
                        ? "up"
                        : "down";


                    const arrow =
                        change >= 0
                        ? "↑"
                        : "↓";


                    const card =
                        document.createElement("div");


                    card.className = "card";


                    card.innerHTML = `

                        <h2>
                            ${coin.name}
                            (${coin.symbol.toUpperCase()})
                        </h2>

                        <div class="price">
                            $${coin.current_price.toLocaleString()}
                        </div>

                        <div class="change ${changeClass}">
                            ${arrow}
                            ${Math.abs(change).toFixed(2)}%
                        </div>

                    `;


                    container.appendChild(card);

                });

            }

            catch (error) {

                console.log(error);

                document.getElementById(
                    "error"
                ).innerText =
                    "Unable to load cryptocurrency data.";

            }

        }


        // First API call
        getCryptoData();


        // Update crypto data every 30 seconds
        setInterval(
            getCryptoData,
            30000
        );


        // Update time every 1 second
        setInterval(function() {

            document.getElementById(
                "updated"
            ).innerText =
                "Current time: " +
                new Date().toLocaleTimeString();

        }, 1000);

    </script>

</body>
</html>
